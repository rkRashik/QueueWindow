name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: queuewindow_test
          POSTGRES_USER: queuewindow
          POSTGRES_PASSWORD: queuewindow_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U queuewindow -d queuewindow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          QW_TEST_DATABASE_URL: postgresql://queuewindow:queuewindow_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/queuewindow_test
      - run: npm run build
